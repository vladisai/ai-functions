<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV-cache state update</title>
<style>
:root{
  --text:#1f1e1d; --text2:#5f5e5a; --line:#b4b2a9; --bg:#ffffff; --btn-border:#b4b2a9; --btn-hover:#f1efe8;
  --teal-fill:#E1F5EE; --teal-stroke:#0F6E56; --teal-text:#085041;
  --purple-fill:#EEEDFE; --purple-stroke:#534AB7; --purple-text:#3C3489;
  --amber-fill:#FAEEDA; --amber-stroke:#854F0B; --amber-text:#633806;
  --gray-fill:#F1EFE8; --gray-stroke:#5F5E5A; --gray-text:#444441;
  --attn:#EF9F27;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --text:#e8e6dc; --text2:#b4b2a9; --line:#5f5e5a; --bg:#1f1e1d; --btn-border:#5f5e5a; --btn-hover:#2c2c2a;
    --teal-fill:#085041; --teal-stroke:#5DCAA5; --teal-text:#E1F5EE;
    --purple-fill:#3C3489; --purple-stroke:#AFA9EC; --purple-text:#EEEDFE;
    --amber-fill:#633806; --amber-stroke:#EF9F27; --amber-text:#FAEEDA;
    --gray-fill:#444441; --gray-stroke:#B4B2A9; --gray-text:#F1EFE8;
  }
}
:root[data-theme="dark"]{
  --text:#e8e6dc; --text2:#b4b2a9; --line:#5f5e5a; --bg:#1f1e1d; --btn-border:#5f5e5a; --btn-hover:#2c2c2a;
  --teal-fill:#085041; --teal-stroke:#5DCAA5; --teal-text:#E1F5EE;
  --purple-fill:#3C3489; --purple-stroke:#AFA9EC; --purple-text:#EEEDFE;
  --amber-fill:#633806; --amber-stroke:#EF9F27; --amber-text:#FAEEDA;
  --gray-fill:#444441; --gray-stroke:#B4B2A9; --gray-text:#F1EFE8;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin:0 0 8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;border:0.5px solid var(--line)}
#status{font-size:15px;margin:8px 0 12px;min-height:24px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:0.5px solid var(--btn-border);border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{background:var(--btn-hover)}
button:focus-visible{outline:2px solid var(--purple-stroke);outline-offset:2px}
.hint{font-size:12px;color:var(--text2);margin-top:10px}
body.clean .controls, body.clean .hint{display:none}
svg text{font-family:inherit}
.ts{font-size:12px;fill:var(--text2)}
.th{font-size:12px;font-weight:600;fill:var(--text)}
.c-teal>rect{fill:var(--teal-fill);stroke:var(--teal-stroke)} .c-teal>text{fill:var(--teal-text)}
.c-purple>rect{fill:var(--purple-fill);stroke:var(--purple-stroke)} .c-purple>text{fill:var(--purple-text)}
.c-amber>rect{fill:var(--amber-fill);stroke:var(--amber-stroke)} .c-amber>text{fill:var(--amber-text)}
.c-gray>rect{fill:var(--gray-fill);stroke:var(--gray-stroke)} .c-gray>text{fill:var(--gray-text)}
</style>
</head>
<body>
<main>
<div class="legend">
  <span><span class="sw" style="background:var(--teal-fill)"></span>Injected token (control)</span>
  <span><span class="sw" style="background:var(--purple-fill)"></span>Sampled token (autonomous)</span>
  <span><span class="sw" style="background:var(--amber-fill)"></span>Being computed</span>
</div>
<svg id="viz" width="100%" viewBox="0 0 680 410" role="img" aria-label="KV-cache state update"></svg>
<div id="status"></div>
<div class="controls">
  <button id="step" onclick="step()">Run forward pass</button>
  <button onclick="inject()">Inject tool output</button>
  <button onclick="reset()">Reset</button>
</div>
<div class="hint">Keys: Space or right arrow = next phase, I = inject tool output, R = reset. URL options: ?seed=42 for a reproducible run, ?clean=1 to hide controls, ?theme=light or ?theme=dark.</div>
</main>
<script>
const params = new URLSearchParams(location.search);
if (params.get('clean') === '1') document.body.classList.add('clean');
if (params.get('theme')) document.documentElement.setAttribute('data-theme', params.get('theme'));

// Seeded RNG (mulberry32) so a run can be reproduced exactly, e.g. for exporting slide images.
const seedParam = params.get('seed');
function makeRng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = Math.random;

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('viz');
const MAX = 8, X0 = 110, CW = 66;

// Scripted next-token distributions (illustrative, not from a real model).
const cands = [
  [['I',.46],['Let',.31],['Sure',.15],['The',.08]],
  [["'ll",.52],['will',.28],['can',.12],['need',.08]],
  [['run',.58],['check',.25],['read',.11],['fix',.06]],
  [['the',.64],['pytest',.22],['it',.09],['all',.05]],
  [['tests',.71],['suite',.18],['code',.07],['test',.04]],
  [['first',.40],['now',.30],['again',.20],['.',.10]]
];

// src: 'c' = injected by controller, 's' = sampled by model. kv: cache computed. fresh: computed this pass.
let toks, phase, gen, weights, sampled;

function reset(){
  if (seedParam !== null) rand = makeRng(parseInt(seedParam, 10) || 0);
  toks = [{w:'Fix',src:'c',kv:true},{w:'failing',src:'c',kv:true},{w:'test',src:'c',kv:true}];
  phase = 0; gen = 0; weights = null; sampled = null;
  draw();
}

function make(parent, tag, attrs, txt){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (txt !== undefined) e.textContent = txt;
  parent.appendChild(e);
  return e;
}
const el = (t, a, txt) => make(svg, t, a, txt);
const grp = cls => make(svg, 'g', cls ? {class: cls} : {});
const cx = i => X0 + i * CW;

function draw(){
  svg.innerHTML = '';
  el('text', {class:'ts', x:40, y:57, 'dominant-baseline':'central'}, 'Tokens');
  for (let l = 0; l < 3; l++) el('text', {class:'ts', x:40, y:113 + l*34, 'dominant-baseline':'central'}, 'Layer ' + (l+1));

  // Token row and KV-cache columns
  toks.forEach((t, i) => {
    const g = grp(t.src === 'c' ? 'c-teal' : 'c-purple');
    make(g, 'rect', {x:cx(i), y:40, width:58, height:34, rx:6, 'stroke-width':0.5});
    make(g, 'text', {class:'ts', x:cx(i)+29, y:57, 'text-anchor':'middle', 'dominant-baseline':'central'}, t.w);
    for (let l = 0; l < 3; l++){
      ['K','V'].forEach((kv, j) => {
        const x = cx(i) + j*30, y = 100 + l*34;
        if (t.kv){
          const cg = grp(t.fresh ? 'c-amber' : 'c-gray');
          make(cg, 'rect', {x, y, width:28, height:26, rx:4, 'stroke-width':0.5});
          make(cg, 'text', {class:'ts', x:x+14, y:y+13, 'text-anchor':'middle', 'dominant-baseline':'central'}, kv);
        } else {
          el('rect', {x, y, width:28, height:26, rx:4, fill:'none', stroke:'var(--line)', 'stroke-width':0.5, 'stroke-dasharray':'3 3'});
        }
      });
    }
  });

  // Empty slot for the next token
  if (toks.length < MAX){
    const i = toks.length;
    el('rect', {x:cx(i), y:40, width:58, height:34, rx:6, fill:'none', stroke:'var(--line)', 'stroke-width':0.5, 'stroke-dasharray':'3 3'});
    el('text', {class:'ts', x:cx(i)+29, y:57, 'text-anchor':'middle', 'dominant-baseline':'central'}, '?');
  }

  // Attention from the newest token's query over all cached keys (one layer shown)
  if (weights){
    const q = toks.length - 1, qx = cx(q) + 29;
    toks.forEach((t, i) => el('line', {x1:qx, y1:222, x2:cx(i)+29, y2:196, stroke:'var(--attn)', 'stroke-width':1 + weights[i]*6, opacity:.25 + weights[i]*1.5, 'stroke-linecap':'round'}));
    el('circle', {cx:qx, cy:228, r:6, fill:'var(--attn)'});
    el('text', {class:'ts', x:40, y:228, 'dominant-baseline':'central'}, 'Query');
  }

  // Next-token distribution
  if (phase >= 2 || sampled){
    const c = cands[Math.min(gen, cands.length - 1)];
    el('text', {class:'ts', x:40, y:262, 'dominant-baseline':'central'}, 'p(next token | state)');
    c.forEach(([w, p], k) => {
      const y = 280 + k*30, hit = sampled === w;
      el('text', {class: hit ? 'th' : 'ts', x:110, y:y+11, 'dominant-baseline':'central'}, w);
      const bg = grp(hit ? 'c-purple' : 'c-gray');
      make(bg, 'rect', {x:190, y, width:Math.max(4, p*380), height:22, rx:4, 'stroke-width':0.5});
      el('text', {class:'ts', x:196 + p*380, y:y+11, 'dominant-baseline':'central'}, Math.round(p*100) + '%');
    });
  }

  const btn = document.getElementById('step'), st = document.getElementById('status');
  if (toks.length >= MAX && phase === 0){
    btn.textContent = 'Context full';
    st.textContent = 'The context window is the horizon: the state can no longer grow. Reset to start again.';
    return;
  }
  if (phase === 0){
    btn.textContent = 'Run forward pass';
    st.textContent = toks.some(t => !t.kv)
      ? 'State = token history. New tokens have no keys and values yet.'
      : 'State = token history, stored as keys and values at every layer.';
  }
  if (phase === 1){
    btn.textContent = 'Compute distribution';
    st.textContent = 'Forward pass: new K and V written to the cache; the newest query attends over all cached keys.';
  }
  if (phase === 2){
    btn.textContent = 'Sample next token';
    st.textContent = 'The output is a distribution over the vocabulary, not a token. This is where stochasticity enters.';
  }
}

function step(){
  if (toks.length >= MAX && phase === 0) return;
  if (phase === 0){
    toks.forEach(t => { t.fresh = !t.kv; t.kv = true; });
    const n = toks.length;
    const r = toks.map((_, i) => Math.exp(1.2*rand() + (i === n-1 ? 1 : 0) + (i === 1 ? .8 : 0)));
    const s = r.reduce((a, b) => a + b, 0);
    weights = r.map(v => v / s);
    sampled = null; phase = 1;
  } else if (phase === 1){
    phase = 2;
  } else if (phase === 2){
    const c = cands[Math.min(gen, cands.length - 1)];
    let u = rand(), acc = 0, pick = c[c.length - 1][0];
    for (const [w, p] of c){ acc += p; if (u <= acc){ pick = w; break; } }
    sampled = pick;
    toks.forEach(t => t.fresh = false);
    toks.push({w:pick, src:'s', kv:false});
    weights = null; phase = 0;
    draw(); gen++;
    document.getElementById('status').textContent = 'Sampled "' + pick + '" and appended it: x(t+1) = x(t) plus a new token. Its K and V are computed on the next pass.';
    return;
  }
  draw();
}

function inject(){
  if (toks.length > MAX - 2){
    document.getElementById('status').textContent = 'Not enough room in the context window to inject.';
    return;
  }
  toks.forEach(t => t.fresh = false);
  toks.push({w:'[tool]', src:'c', kv:false}, {w:'2 fail', src:'c', kv:false});
  weights = null; sampled = null; phase = 0;
  draw();
  document.getElementById('status').textContent = "Control input: the environment's tokens are appended directly. No sampling happens here.";
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); step(); }
  else if (e.key === 'i' || e.key === 'I') inject();
  else if (e.key === 'r' || e.key === 'R') reset();
});

reset();
</script>
</body>
</html>
